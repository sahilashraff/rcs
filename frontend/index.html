<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title></title>
    <script>
      fetch('/api/branding').then(r=>r.json()).then(({data:b})=>{
        if(b.site_name) document.title=b.site_name
        if(b.meta_description) document.querySelector('meta[name="description"]')?.setAttribute('content',b.meta_description)
        if(b.favicon_url) document.querySelector("link[rel='icon']").href=b.favicon_url
      }).catch(()=>{})
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
